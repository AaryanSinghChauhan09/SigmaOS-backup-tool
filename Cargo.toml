[package]
name = "sigmaos-backup-tool"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "System backup and restore with snapshot support"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-backup-tool"
readme = "README.md"
keywords = ["backup", "restore", "snapshot"]
categories = ["os"]

[dependencies]
sigmaos-kernel = { version = "0.1", path = "../SigmaOS-kernel" }
sigmaos-filesystem = { version = "0.1", path = "../SigmaOS-filesystem" }

[profile.release]
opt-level = 3
